  <!DOCTYPE html>
  <html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>UniConnect — Feed</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/layout-sidebar.css" />
    <link rel="stylesheet" href="./css/comment-modal.css" />
    <link rel="stylesheet" href="./css/user-list.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
  </head>

  <body class="page-enter">
    <div id="mobileMenuToggle">☰</div>
    <div class="app">

      <!-- SIDEBAR ESQUERDA -->
      <aside class="sidebar-left">
        <div class="brand">
          <img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png" alt="logo">
          <h2>UniConnect</h2>
        </div>

        <nav class="nav">
          <a href="./painel.html" class="nav-link active">🏠 Feed</a>
          <a href="./create-post.html" class="nav-link">➕ Criar post</a>
          <a href="./alerts.html" class="nav-link">🚨 Alertas</a>
          <a href="./events.html" class="nav-link">📅 Eventos</a>
        </nav>

        <div class="sidebar-footer">
          <button id="btnLogin" class="btn small">Entrar</button>
        </div>
      </aside>

      <!-- ÁREA PRINCIPAL -->
      <main class="content fade-in">
        <header class="topbar">
          <h1>Feed</h1>
        </header>

        <section id="feed" class="feed"></section>
      </main>

      <!-- SIDEBAR DIREITA -->
      <aside class="sidebar-right">
        <div class="users-header">Usuários online</div>
        <ul id="usersListAlerts" class="users-list"></ul>
      </aside>

    </div>

    <!-- 🔥 MODAL DE COMENTÁRIOS -->
    <div id="commentModal" class="modal-backdrop hidden">
      <div class="modal-card comment-modal">
        <h3>Comentários</h3>

        <ul id="commentList"></ul>

        <textarea id="newComment" class="material-input" placeholder="Escreva um comentário..."></textarea>

        <div class="actions-row" style="margin-top:12px; display:flex; gap:10px;">
          <button id="sendComment" class="btn">Enviar</button>
          <button id="closeCommentModal" class="btn ghost">Fechar</button>
        </div>
      </div>
    </div>


    <script src="./js/app.js"></script>
    <script src="./js/users-online.js"></script>
    <script>
      const btn = document.getElementById("mobileMenuToggle");
      const left = document.querySelector(".sidebar-left");

      btn.addEventListener("click", () => {
        left.classList.toggle("open");
      });
    </script>

  </body>
  </html>
