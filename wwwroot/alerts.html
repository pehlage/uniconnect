<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>UniConnect — Alertas</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/layout-sidebar.css" />
  <link rel="stylesheet" href="./css/alerts.css">
  <link rel="stylesheet" href="./css/user-list.css" />
</head>
<body class="page-enter">
  <div id="mobileMenuToggle">☰</div>
  <div class="app">
    <aside class="sidebar-left">
      <div class="brand">
        <img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png" alt="logo">
        <h2>UniConnect</h2>
      </div>
      <nav class="nav" aria-label="menu">
        <a href="./painel.html" class="nav-link">🏠 Feed</a>
        <a href="./create-post.html" class="nav-link">➕ Criar post</a>
        <a href="./alerts.html" class="nav-link active">🚨 Alertas</a>
        <a href="./events.html" class="nav-link">📅 Eventos</a>
      </nav>
      <div class="sidebar-footer">
        <button id="btnLoginAlerts" class="btn small">Entrar</button>
      </div>
    </aside>

    <main class="content fade-in">
      <header class="topbar">
        <h1>Alertas</h1>
        <div class="search"><input placeholder="Pesquisar alertas..." /></div>
      </header>

      <section class="feed">
        <div class="card">Nenhum alerta no momento.</div>
      </section>
    </main>

    <aside class="sidebar-right">
      <div class="users-header">Usuários online</div>
      <ul id="usersListAlerts" class="users-list"></ul>
    </aside>
  </div>

  <script src="./js/app.js"></script>
  <script src="./js/alerts.js"></script>
  <script src="./js/users-online.js"></script>
  <script>
    const btn = document.getElementById("mobileMenuToggle");
    const left = document.querySelector(".sidebar-left");

    btn.addEventListener("click", () => {
      left.classList.toggle("open");
    });
  </script>
</body>
</html>
