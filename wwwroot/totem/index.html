<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Totem Check-In — UniConnect</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<!-- =====================================================
    TELA DE DESCANSO (iOS Lock Screen Style)
===================================================== -->
<div id="lockScreen" class="lock-screen">

  <img src="./assets/evento.jpg" class="event-poster" />

  <div class="lock-overlay">
    <h1 class="lock-title">Projeto Integrador</h1>
    <p class="lock-sub">Toque em qualquer lugar da tela</p>

    <div class="touch-icon" aria-hidden="true">
      <div class="tap-circle">
          <div class="tap-inner"></div>
      </div>
    </div>
  </div>

</div>

<!-- =====================================================
    TELA DO TOTEM (Apple Glass Card)
===================================================== -->
<div id="totemPage" class="totem-container hidden">

  <button id="backBtn" class="back-btn">←</button>

  <div class="totem-card">

    <h1 class="title">Projeto Integrador</h1>

    <!-- Seleção Premium -->
    <div id="userTypeSelect" class="card-select">

      <div id="studentCard" class="select-card">
        <div class="icon">👨‍🎓</div>
        <div class="label">Sou Estudante</div>
      </div>

      <div id="visitorCard" class="select-card">
        <div class="icon">🧑‍💼</div>
        <div class="label">Sou Visitante</div>
      </div>

    </div>

    <!-- Botão aparece somente após escolha -->
    <button id="checkinBtn" class="btn primary hidden">Iniciar Check-In</button>

    <!-- FORM ESTUDANTE -->
    <div id="formStudent" class="hidden form-block">

      <input id="nameStudent" class="input" placeholder="Seu nome">

      <div class="search-box">
        <input id="courseStudent" class="input" placeholder="Seu curso">
        <ul id="courseList" class="autocomplete hidden"></ul>
      </div>

      <div class="search-box">
        <input id="collegeStudent" class="input" placeholder="Sua faculdade">
        <ul id="collegeListStudent" class="autocomplete hidden"></ul>
      </div>

      <input id="semesterStudent" class="input" placeholder="Seu semestre (ex: 3)">

      <label class="label">O que está achando do evento?</label>
      <div id="ratingEvent" class="rating">
        <span class="emoji">😐</span>
        <span class="emoji">🙂</span>
        <span class="emoji">😄</span>
        <span class="emoji">🤩</span>
      </div>

      <button id="nextBtnStudent" class="btn primary">Próximo</button>
    </div>

    <!-- FORM VISITANTE -->
    <div id="formVisitor" class="hidden form-block">

      <input id="visitorName" class="input" placeholder="Nome">
      <input id="visitorLastName" class="input" placeholder="Sobrenome">

      <label class="label">O que está achando do evento?</label>
      <div id="ratingEventVisitor" class="rating">
        <span class="emoji">😐</span>
        <span class="emoji">🙂</span>
        <span class="emoji">😄</span>
        <span class="emoji">🤩</span>
      </div>

      <button id="finalizeVisitorBtn" class="btn primary">Finalizar</button>
    </div>

    <!-- FORM ESTUDANTE — ETAPA 2 -->
    <div id="formStudent2" class="hidden form-block">
      <label class="label">Avaliação da apresentação</label>

      <div id="ratingPresentation" class="rating">
        <span class="emoji">😐</span>
        <span class="emoji">🙂</span>
        <span class="emoji">😄</span>
        <span class="emoji">🤩</span>
      </div>

      <button id="finalizeStudentBtn" class="btn primary">Finalizar</button>
    </div>

    <!-- SUCESSO -->
    <div id="success" class="hidden success">
      <svg viewBox="0 0 48 48" width="70" height="70">
        <circle cx="24" cy="24" r="22" fill="#18c96e"/>
        <path d="M14 24l6 6 14-14" stroke="white" stroke-width="5"
              stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </svg>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
<script src="./js/totem.js"></script>
</body>
</html>
