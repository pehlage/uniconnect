<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>UniConnect — Criar Post</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/create-post.css" />
  <link rel="stylesheet" href="./css/layout-sidebar.css" />
</head>
<body class="page-enter">
  <div id="mobileMenuToggle">☰</div>
  <div class="app no-right">
    <aside class="sidebar-left">
      <div class="brand">
        <img src="./assets/logo.png" alt="logo">
        <h2>UniConnect</h2>
      </div>
      <nav class="nav" aria-label="menu">
        <a href="./painel.html" class="nav-link">🏠 Feed</a>
        <a href="./create-post.html" class="nav-link active">➕ Criar post</a>
        <a href="./alerts.html" class="nav-link">🚨 Alertas</a>
        <a href="./events.html" class="nav-link">📅 Eventos</a>
      </nav>
      <div class="sidebar-footer">
        <button id="btnLogin2" class="btn-login">Entrar</button>
      </div>
    </aside>

    <main class="content fade-in">
      <div class="create-card">
        <h2>Novo post</h2>
        <input id="postTitle" class="material-input" placeholder="Título" />
        <textarea id="postBody" class="material-input" placeholder="Escreva aqui..."></textarea>

        <div style="position:relative;">
          <input id="postCourse" class="material-input" placeholder="Curso (opcional)" autocomplete="off" />
          <ul id="courseList" class="dropdown"></ul>
        </div>

        <div class="actions-row">
          <a href="./painel.html" class="btn ghost">Voltar</a>
          <button id="publishBtn" class="btn">Publicar</button>
        </div>
        <small class="muted">Ao publicar, o post será enviado em tempo real ao painel.</small>
      </div>
    </main>
  </div>

  <script src="./js/app.js"></script>
  <script src="./js/create-post.js"></script>
  <script>
    const btn = document.getElementById("mobileMenuToggle");
    const left = document.querySelector(".sidebar-left");

    btn.addEventListener("click", () => {
      left.classList.toggle("open");
    });
  </script>
</body>
</html>
